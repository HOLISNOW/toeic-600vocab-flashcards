<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>單字卡片複習</title>
<style>
  :root{
    --paper: #17171b;
    --paper-edge: #2b2a2f;
    --surface: #212024;
    --ink: #e9e4d8;
    --ink-soft: #948d81;
    --rule: #38363b;
    --work: #7fb2d9;
    --work-soft: #22323d;
    --life: #8dc57e;
    --life-soft: #263429;
    --travel: #dd9a5c;
    --travel-soft: #3a2d1f;
    --unfamiliar: #e2825a;
    --medium: #e4bc5e;
    --familiar: #7bc98a;
    --shadow: 0 1px 0 rgba(0,0,0,.4), 0 14px 28px -16px rgba(0,0,0,.65);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(1200px 600px at 15% -10%, #1c1c21 0%, var(--paper) 55%),
      var(--paper);
    color:var(--ink);
    font-family: "Iowan Old Style","Palatino Linotype","Noto Serif TC",Georgia,"PMingLiU",serif;
    min-height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 28px 16px 40px;
  }
  .app{ width:100%; max-width:620px; }

  header.top{
    display:flex; align-items:baseline; justify-content:space-between;
    margin-bottom:18px; flex-wrap:wrap; gap:8px;
  }
  header.top h1{
    font-size:20px; margin:0; font-weight:600; letter-spacing:.02em;
  }
  header.top .sub{
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size:12px; color:var(--ink-soft);
  }

  nav.cats{
    display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  nav.cats button{
    border:1px solid var(--rule); background:var(--surface); color:var(--ink-soft);
    padding:7px 13px; border-radius:3px; font-size:13px; cursor:pointer;
    transition: all .15s ease;
  }
  nav.cats button.active[data-cat="all"]{ background:var(--ink); color:var(--paper); border-color:var(--ink);}
  nav.cats button.active[data-cat="work"]{ background:var(--work); color:#12202a; border-color:var(--work);}
  nav.cats button.active[data-cat="life"]{ background:var(--life); color:#14210f; border-color:var(--life);}
  nav.cats button.active[data-cat="travel"]{ background:var(--travel); color:#2b1c0e; border-color:var(--travel);}

  .toolbar{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:16px; gap:10px; flex-wrap:wrap;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  select.filter{
    border:1px solid var(--rule); background:var(--surface); color:var(--ink);
    padding:6px 10px; border-radius:3px; font-size:13px;
  }
  .icon-btn{
    border:1px solid var(--rule); background:var(--surface); color:var(--ink-soft);
    width:32px;height:32px;border-radius:3px;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;font-size:15px;
  }
  .icon-btn:hover{ background:#2b2a30; }

  .progress-wrap{
    height:5px; background:var(--paper-edge); border-radius:3px; overflow:hidden; margin-bottom:22px;
  }
  .progress-bar{ height:100%; background:var(--ink); width:0%; transition:width .25s ease; }

  .stage{
    perspective: 1600px;
    margin-bottom: 20px;
  }
  .card{
    position:relative;
    width:100%;
    height: 340px;
    transform-style:preserve-3d;
    transition: transform .5s cubic-bezier(.2,.7,.3,1), height .25s ease;
    cursor:pointer;
  }
  .card.flipped{ transform: rotateY(180deg); }
  .face{
    position:absolute; inset:0;
    backface-visibility:hidden;
    background:var(--surface);
    border:1px solid var(--rule);
    border-radius:6px;
    box-shadow: var(--shadow);
    padding:30px 26px 22px;
    display:flex; flex-direction:column;
    overflow-y:auto;
    max-height: 85vh;
  }
  .face::before{
    content:"";
    position:absolute; left:22px; right:22px; top:0; height:5px;
    border-radius:0 0 3px 3px;
  }
  .face.front::before{ background:var(--cat-color, var(--ink)); }
  .face.back{ transform: rotateY(180deg); }
  .face.back::before{ background:var(--cat-color, var(--ink)); }

  .card-tag{
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size:11px; letter-spacing:.06em; color:var(--cat-color, var(--ink-soft));
    margin-bottom:auto;
  }

  .word-row{ display:flex; align-items:center; gap:10px; margin: 30px 0 6px;}
  .word{ font-size:34px; font-weight:600; word-break:break-word; }
  .pos{ font-size:14px; font-style:italic; color:var(--ink-soft); margin-bottom:18px; }
  .hint{
    margin-top:auto;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size:12px; color:var(--ink-soft); text-align:center;
  }

  .back .meaning{ font-size:22px; margin: 4px 0 14px; overflow-wrap:break-word; }
  .back .divider{ height:1px; background:var(--rule); margin:14px 0; }
  .back .label{
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size:11px; letter-spacing:.05em; color:var(--ink-soft); margin-bottom:4px;
  }
  .back .phrase-en{ font-size:16px; margin-bottom:2px; overflow-wrap:break-word; }
  .back .phrase-zh{ font-size:14px; color:var(--ink-soft); margin-bottom:12px;}
  .back .sent-en{ font-size:15px; line-height:1.55; flex:1; min-width:0; overflow-wrap:break-word; }

  .speak-btn{
    border:1px solid var(--rule); background:var(--surface); color:var(--ink);
    width:30px;height:30px;border-radius:50%;cursor:pointer;flex:0 0 auto;
    display:inline-flex;align-items:center;justify-content:center;font-size:14px;
  }
  .speak-btn:active{ transform: scale(.92); }
  .row-with-speak{ display:flex; align-items:center; gap:8px; }
  .row-with-speak.sent-row{ align-items:flex-start; }
  .row-with-speak.sent-row .speak-btn{ margin-top:1px; }

  .rate-row{
    display:flex; gap:10px; margin-bottom:14px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .rate-btn{
    flex:1; padding:12px 6px; border-radius:5px; border:1px solid var(--rule);
    background:var(--surface); font-size:14px; cursor:pointer; color:var(--ink);
    transition: all .12s ease;
  }
  .rate-btn:active{ transform: scale(.97); }
  .rate-btn.unfamiliar:hover, .rate-btn.unfamiliar.selected{ background:var(--unfamiliar); color:#fff; border-color:var(--unfamiliar);}
  .rate-btn.medium:hover, .rate-btn.medium.selected{ background:var(--medium); color:#fff; border-color:var(--medium);}
  .rate-btn.familiar:hover, .rate-btn.familiar.selected{ background:var(--familiar); color:#fff; border-color:var(--familiar);}

  .nav-row{
    display:flex; justify-content:space-between; align-items:center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .nav-row button{
    border:none; background:none; color:var(--ink-soft); font-size:13px; cursor:pointer;
    padding:8px 4px;
  }
  .nav-row button:hover{ color:var(--ink); }
  .nav-row .counter{ font-size:12px; color:var(--ink-soft); }

  .empty-state{
    text-align:center; padding: 60px 20px; color:var(--ink-soft);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size:14px;
  }

  .stats-strip{
    display:flex; gap:14px; margin-top:24px; justify-content:center; flex-wrap:wrap;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size:12px; color:var(--ink-soft);
  }
  .stats-strip span.dot{ display:inline-block; width:8px;height:8px;border-radius:50%; margin-right:5px; vertical-align:middle;}

  @media (max-width: 420px){
    .word{font-size:28px;}
    .face{padding:24px 18px 18px;}
  }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>單字卡片複習</h1>
    <div class="sub">點卡片翻面・喇叭發音・選熟悉度</div>
  </header>

  <nav class="cats" id="catNav">
    <button data-cat="all" class="active">全部</button>
    <button data-cat="work">職場工作</button>
    <button data-cat="life">日常生活</button>
    <button data-cat="travel">觀光旅遊</button>
  </nav>

  <div class="toolbar">
    <select class="filter" id="filterSelect">
      <option value="all">顯示全部</option>
      <option value="unrated">只顯示尚未標記</option>
      <option value="unfamiliar">只顯示不熟悉</option>
      <option value="medium">只顯示普通</option>
      <option value="familiar">只顯示熟悉</option>
    </select>
    <div style="display:flex; gap:8px; align-items:center;">
      <select class="filter" id="voiceSelect" title="發音來源">
        <option value="google">Google 翻譯語音</option>
        <option value="browser">瀏覽器內建語音</option>
      </select>
      <button class="icon-btn" id="shuffleBtn" title="隨機排序">⤨</button>
      <button class="icon-btn" id="resetBtn" title="重設此範圍的標記">↺</button>
    </div>
  </div>

  <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>

  <div id="stageWrap">
    <div class="stage">
      <div class="card" id="card">
        <div class="face front">
          <div class="card-tag" id="frontTag"></div>
          <div class="word-row">
            <div class="word" id="wordText"></div>
            <button class="speak-btn" id="speakWordBtn" title="發音">🔊</button>
          </div>
          <div class="pos" id="posText"></div>
          <div class="hint">點卡片查看意思</div>
        </div>
        <div class="face back">
          <div class="card-tag" id="backTag"></div>
          <div class="row-with-speak">
            <div class="word" id="wordText2" style="font-size:22px;"></div>
            <button class="speak-btn" id="speakWordBtn2" title="發音">🔊</button>
          </div>
          <div class="pos" id="posText2" style="margin-bottom:6px;"></div>
          <div class="meaning" id="meaningText"></div>
          <div id="phraseBlock">
            <div class="divider"></div>
            <div class="label">常用片語</div>
            <div class="phrase-en" id="phraseEn"></div>
            <div class="phrase-zh" id="phraseZh"></div>
          </div>
          <div class="divider"></div>
          <div class="label">例句</div>
          <div class="row-with-speak sent-row">
            <div class="sent-en" id="sentText"></div>
            <button class="speak-btn" id="speakSentBtn" title="朗讀例句">🔊</button>
          </div>
        </div>
      </div>
    </div>

    <div class="rate-row">
      <button class="rate-btn unfamiliar" data-rate="unfamiliar">不熟悉</button>
      <button class="rate-btn medium" data-rate="medium">普通</button>
      <button class="rate-btn familiar" data-rate="familiar">熟悉</button>
    </div>

    <div class="nav-row">
      <button id="prevBtn">← 上一張</button>
      <span class="counter" id="counterText"></span>
      <button id="nextBtn">下一張 →</button>
    </div>
  </div>

  <div class="stats-strip" id="statsStrip"></div>
</div>

<script>
(function(){

    all:   {label:'全部',     color:'#e9e4d8'},

  const STATUS_COLOR = {unfamiliar:'#e2825a', medium:'#e4bc5e', familiar:'#7bc98a'};

  const ALL_CARDS = JSON.parse(document.getElementById('card-data').textContent);

  let currentFilter = 'all';
  let queue = [];
  let qIndex = 0;
  let flipped = false;

  const el = (id) => document.getElementById(id);

  async function loadStatus(){
    try{
      const res = await window.storage.get('card-status', false);
      if (res && res.value) statusMap = JSON.parse(res.value);
    }catch(e){ statusMap = {}; }
  }
  async function saveStatus(){
    try{ await window.storage.set('card-status', JSON.stringify(statusMap), false); }
    catch(e){ /* best effort */ }
  }

  function buildQueue(){
    let list = ALL_CARDS.filter(c => currentCat === 'all' || c.cat === currentCat);
    if (currentFilter === 'unrated') list = list.filter(c => !statusMap[c.id]);
    else if (currentFilter !== 'all') list = list.filter(c => statusMap[c.id] === currentFilter);
    queue = list;
    qIndex = 0;
    flipped = false;
  }

  function shuffleQueue(){
    for (let i = queue.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [queue[i], queue[j]] = [queue[j], queue[i]];
    }
    qIndex = 0;
    flipped = false;
    render();
  }

  function currentCard(){ return queue[qIndex]; }

  let currentAudio = null;

  function speakBrowser(text, lang){
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang || 'en-US';
    u.rate = 0.95;
    window.speechSynthesis.speak(u);
  }

  function chunkText(text, maxLen){
    maxLen = maxLen || 190;
    const words = text.split(' ');
    const chunks = [];
    let cur = '';
    for (const w of words){
      const candidate = cur ? cur + ' ' + w : w;
      if (candidate.length > maxLen && cur){ chunks.push(cur); cur = w; }
      else { cur = candidate; }
    }
    if (cur) chunks.push(cur);
    return chunks;
  }

  function playOneChunk(chunk, lang){
    return new Promise((resolve, reject) => {
      const url = 'https://translate.google.com/translate_tts?ie=UTF-8&q=' +
        encodeURIComponent(chunk) + '&tl=' + (lang || 'en') + '&client=tw-ob';
      const audio = new Audio(url);
      currentAudio = audio;
      audio.onended = resolve;
      audio.onerror = reject;
      audio.play().catch(reject);
    });
  }

  async function speakGoogle(text, lang){
    const chunks = chunkText(text);
    for (const chunk of chunks){
      await playOneChunk(chunk, lang);
    }
  }

  function stopAudio(){
    if (currentAudio){ currentAudio.pause(); currentAudio = null; }
    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
  }

  async function speak(text, lang){
    stopAudio();
    const useGoogle = el('voiceSelect') ? el('voiceSelect').value !== 'browser' : true;
    if (useGoogle){
      try{
        await speakGoogle(text, lang === 'en-US' ? 'en' : lang);
        return;
      }catch(e){
        // Google TTS unavailable (offline / blocked) — fall back automatically
      }
    }
    speakBrowser(text, lang);
  }

  function renderStats(){
    const list = ALL_CARDS.filter(c => currentCat === 'all' || c.cat === currentCat);
    const counts = {unfamiliar:0, medium:0, familiar:0, unrated:0};
    list.forEach(c => {
      const s = statusMap[c.id];
      if (s) counts[s]++; else counts.unrated++;
    });
    el('statsStrip').innerHTML =
      `<span><span class="dot" style="background:${STATUS_COLOR.unfamiliar}"></span>不熟悉 ${counts.unfamiliar}</span>` +
      `<span><span class="dot" style="background:${STATUS_COLOR.medium}"></span>普通 ${counts.medium}</span>` +
      `<span><span class="dot" style="background:${STATUS_COLOR.familiar}"></span>熟悉 ${counts.familiar}</span>` +
      `<span><span class="dot" style="background:#5a564c"></span>尚未標記 ${counts.unrated}</span>` +
      `<span>共 ${list.length} 字</span>`;
  }

  function render(){
    renderStats();
    const wrap = el('stageWrap');
    if (queue.length === 0){
      wrap.innerHTML = '<div class="empty-state">這個範圍目前沒有符合條件的單字 🙂<br>試試切換上方的分類或篩選條件。</div>';
      el('progressBar').style.width = '0%';
      return;
    }
    if (!document.getElementById('card')){
      // rebuild stage markup if it was replaced by empty-state
      location.reload();
      return;
    }
    const c = currentCard();
    const catColor = CAT_INFO[c.cat].color;
    document.querySelectorAll('.face').forEach(f => f.style.setProperty('--cat-color', catColor));

    el('frontTag').textContent = CAT_INFO[c.cat].label;
    el('backTag').textContent = CAT_INFO[c.cat].label;
    el('wordText').textContent = c.w;
    el('wordText2').textContent = c.w;
    el('posText').textContent = c.pos;
    el('posText2').textContent = c.pos;
    el('meaningText').textContent = c.mean;
    el('sentText').textContent = c.sent || '（無例句）';

    if (c.phrase){
      el('phraseBlock').style.display = '';
      el('phraseEn').textContent = c.phrase;
      el('phraseZh').textContent = c.pm;
    } else {
      el('phraseBlock').style.display = 'none';
    }

    const card = el('card');
    card.classList.toggle('flipped', flipped);

    el('counterText').textContent = `${qIndex + 1} / ${queue.length}`;
    el('progressBar').style.width = `${((qIndex) / queue.length) * 100}%`;

    document.querySelectorAll('.rate-btn').forEach(btn => {
      btn.classList.toggle('selected', statusMap[c.id] === btn.dataset.rate);
    });

    fitCardHeight();
  }

  function fitCardHeight(){
    const card = el('card');
    if (!card) return;
    const front = card.querySelector('.face.front');
    const back = card.querySelector('.face.back');
    if (!front || !back) return;
    const contentHeight = Math.max(front.scrollHeight, back.scrollHeight, 260);
    const viewportCap = Math.floor(window.innerHeight * 0.85);
    card.style.height = Math.min(contentHeight + 2, viewportCap) + 'px';
  }

  let resizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(fitCardHeight, 150);
  });
  function goNext(){
    if (queue.length === 0) return;
    flipped = false;
    qIndex = (qIndex + 1) % queue.length;
    render();
  }
  function goPrev(){
    if (queue.length === 0) return;
    flipped = false;
    qIndex = (qIndex - 1 + queue.length) % queue.length;
    render();
  }

  function rate(status){
    if (queue.length === 0) return;
    const c = currentCard();
    statusMap[c.id] = status;
    saveStatus();
    render();
    setTimeout(goNext, 220);
  }

  document.getElementById('catNav').addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    document.querySelectorAll('#catNav button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentCat = btn.dataset.cat;
    buildQueue();
    render();
  });

  el('filterSelect').addEventListener('change', (e) => {
    currentFilter = e.target.value;
    buildQueue();
    render();
  });

  el('shuffleBtn').addEventListener('click', shuffleQueue);

  el('resetBtn').addEventListener('click', () => {
    if (!confirm('確定要清除目前這個範圍內所有單字的熟悉度標記嗎？')) return;
    const list = ALL_CARDS.filter(c => currentCat === 'all' || c.cat === currentCat);
    list.forEach(c => { delete statusMap[c.id]; });
    saveStatus();
    buildQueue();
    render();
  });

  document.addEventListener('click', (e) => {
    if (e.target.id === 'card' || e.target.closest('#card')){
      if (e.target.closest('.speak-btn')) return;
      flipped = !flipped;
      el('card').classList.toggle('flipped', flipped);
    }
  });

  el('speakWordBtn').addEventListener('click', (e) => { e.stopPropagation(); speak(currentCard().w); });
  el('speakWordBtn2').addEventListener('click', (e) => { e.stopPropagation(); speak(currentCard().w); });
  el('speakSentBtn').addEventListener('click', (e) => { e.stopPropagation(); speak(currentCard().sent || currentCard().w); });

  document.querySelectorAll('.rate-btn').forEach(btn => {
    btn.addEventListener('click', () => rate(btn.dataset.rate));
  });

  el('prevBtn').addEventListener('click', goPrev);
  el('nextBtn').addEventListener('click', goNext);

  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') goNext();
    else if (e.key === 'ArrowLeft') goPrev();
    else if (e.key === ' '){ e.preventDefault(); flipped = !flipped; el('card').classList.toggle('flipped', flipped); }
    else if (e.key === '1') rate('unfamiliar');
    else if (e.key === '2') rate('medium');
    else if (e.key === '3') rate('familiar');
  });

  (async function init(){
    await loadStatus();
    buildQueue();
    render();
  })();
})();
</script>
</body>
</html>
